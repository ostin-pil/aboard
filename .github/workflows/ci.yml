name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # First, because it needs nothing installed and a broken shell script
      # should not wait on npm. The session-end gate runs the same command
      # (`build_commands` in .claude/lifecycle-manifest.md), but only when a
      # session actually ends on a developer machine that has shellcheck. This
      # step is the unconditional one: bin/check-prose.sh is the prose gate
      # itself and scripts/publish-registry.sh handles a signing key, and
      # neither is reachable from any Node command in this file.
      - name: Shellcheck
        run: shellcheck $(git ls-files '*.sh')

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/package-lock.json
            mcp-server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # A hard gate from the start, unlike lint: the suite is green today, and a
      # gate that is optional on day one never becomes mandatory later.
      - name: Test
        run: npm test

      # A hard gate. The React Compiler-preview errors that used to live here
      # (refs during render, memoization, set-state-in-effect) are fixed, or —
      # where they flag intentional patterns a compiler-off project gains nothing
      # from enforcing — suppressed with a justification at the site. Errors block;
      # the remaining pre-existing warnings do not, since eslint exits non-zero
      # only on errors.
      - name: Lint
        run: npm run lint

      # The reverse of the gaps session 48 closed in the session gate: this one
      # ran only at session end, so a forecast a distrustful reader could not
      # settle could land through a PR from anyone who never runs /session-end.
      # Measured: an utterance-resolved criterion with no resolutionSource
      # passes tsc, test, lint, build and check:built-urls, and is caught here
      # and nowhere else.
      - name: Resolution-criteria lint
        run: npm run lint:resolution -- --strict

      # The build is the data gate: it runs the Zod loader plus the referential
      # integrity checks over data/, so malformed or dangling data fails here by
      # construction. This is what the MCP write path depends on.
      #
      # Deliberately built with no SITE_URL, so CI exercises the default path a
      # contributor gets. siteBaseUrl() now defaults to the canonical origin, so
      # that default emits absolute `@id`s and satisfies the schema's format: uri.
      # Setting SITE_URL here would hide a regression in exactly that default.
      - name: Build
        run: npm run build

      # Absolute URLs are computed by the Metadata API at build time, so neither
      # the type-checker nor the schema validator can see them: a missing
      # metadataBase silently pointed every OG image at localhost across 32 of 33
      # pages. This asserts over the built HTML, the only place it shows.
      - name: Check built URLs
        run: npm run check:built-urls

      # The write path spans three packages. The Worker bundles the canonical Zod
      # schemas out of src/lib, and the MCP server is a client of the endpoint's
      # contract, so a change to src/lib/types.ts can break either one without the
      # app's own type-check noticing.
      # Narrower than it looks, measured in session 48. It does not validate
      # wrangler.jsonc (an unknown compatibility_flag exits 0) and does not fail
      # on a node: import with no nodejs_compat (warning only, exit 0). What it
      # does catch is the wiring between config and code: a stale `main` path
      # exits 1 while tsc exits 0. Worker *types* are already covered, since the
      # root tsconfig includes worker/ — which is why this stays CI-only rather
      # than joining build_commands, where it would cost a wrangler download per
      # session for that one seam.
      - name: Bundle the Worker (write path)
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/worker-build

      - name: Type-check the MCP server
        working-directory: mcp-server
        run: npm ci && npm run typecheck

      # The install was here to let the validate steps below run; the type-check
      # is new. clients/tsconfig.json existed from the start and nothing had
      # ever executed it, so it had been failing on two TS5097 errors unnoticed
      # (the root tsconfig excludes this directory, and tsx strips types without
      # checking them). Session 48 fixed the config and wired it to a command.
      - name: Install and type-check the client adapter
        working-directory: clients
        run: npm ci && npm run typecheck

      # Static export, so there is no server to start — serve out/ and check the
      # published JSON-LD against public/schema/v0.json, the authoritative spec.
      #
      # This is the only place that check exists. No vitest test validates
      # serializer output against v0.json, and session 48 confirmed it: dropping
      # a schema-required field from edgeLD (which has no declared return type,
      # so tsc infers a narrower one and says nothing) passed all six gate
      # commands and failed here, naming the field. It stays CI-only because it
      # needs a served export and ajv is not a root dependency; closing that
      # properly means an in-process test, which is a session of its own.
      - name: Serve the static export
        run: |
          python3 -m http.server 3000 --directory out &
          echo $! > /tmp/http-server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/graph -o /dev/null; then
              echo "static export is serving on :3000"
              exit 0
            fi
            sleep 1
          done
          echo "static server did not come up on :3000" >&2
          exit 1

      - name: Validate /api/graph against the v0 schema
        working-directory: clients
        run: npx tsx validate.ts http://localhost:3000/api/graph

      - name: Validate a single-claim endpoint
        working-directory: clients
        run: npx tsx validate.ts http://localhost:3000/api/claims/S2

      - name: Stop the static server
        if: always()
        run: kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true

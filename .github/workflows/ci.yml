name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/package-lock.json
            mcp-server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # A hard gate from the start, unlike lint: the suite is green today, and a
      # gate that is optional on day one never becomes mandatory later.
      - name: Test
        run: npm test

      # A hard gate. The React Compiler-preview errors that used to live here
      # (refs during render, memoization, set-state-in-effect) are fixed, or —
      # where they flag intentional patterns a compiler-off project gains nothing
      # from enforcing — suppressed with a justification at the site. Errors block;
      # the remaining pre-existing warnings do not, since eslint exits non-zero
      # only on errors.
      - name: Lint
        run: npm run lint

      # The build is the data gate: it runs the Zod loader plus the referential
      # integrity checks over data/, so malformed or dangling data fails here by
      # construction. This is what the MCP write path depends on.
      #
      # Deliberately built with no SITE_URL, so CI exercises the default path a
      # contributor gets. siteBaseUrl() now defaults to the canonical origin, so
      # that default emits absolute `@id`s and satisfies the schema's format: uri.
      # Setting SITE_URL here would hide a regression in exactly that default.
      - name: Build
        run: npm run build

      # The write path spans three packages. The Worker bundles the canonical Zod
      # schemas out of src/lib, and the MCP server is a client of the endpoint's
      # contract, so a change to src/lib/types.ts can break either one without the
      # app's own type-check noticing.
      - name: Bundle the Worker (write path)
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/worker-build

      - name: Type-check the MCP server
        working-directory: mcp-server
        run: npm ci && npm run typecheck

      - name: Install client adapter
        working-directory: clients
        run: npm ci

      # Static export, so there is no server to start — serve out/ and check the
      # published JSON-LD against public/schema/v0.json, the authoritative spec.
      - name: Serve the static export
        run: |
          python3 -m http.server 3000 --directory out &
          echo $! > /tmp/http-server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/graph -o /dev/null; then
              echo "static export is serving on :3000"
              exit 0
            fi
            sleep 1
          done
          echo "static server did not come up on :3000" >&2
          exit 1

      - name: Validate /api/graph against the v0 schema
        working-directory: clients
        run: npx tsx validate.ts http://localhost:3000/api/graph

      - name: Validate a single-claim endpoint
        working-directory: clients
        run: npx tsx validate.ts http://localhost:3000/api/claims/S2

      - name: Stop the static server
        if: always()
        run: kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true

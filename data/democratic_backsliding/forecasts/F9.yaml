      or Closed in 2020 against 83 in 2025, and the 2025 edition alone recorded
      15 downgrades against 3 upgrades, with the downgrades reaching
      consolidated democracies including France, Germany and the USA.
      Continuation is the base case. What holds this well short of near-certain
      is that the question needs a net change in the two worst bands
      specifically, not general deterioration. Most rating moves happen in the
      middle of the scale, so a year with many downgrades can still leave the
      Repressed-plus-Closed count flat if the movement is Open to Narrowed or
      Narrowed to Obstructed. A single upgrade out of Repressed can also offset

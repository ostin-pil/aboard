id: F9
attachedToClaimId: S1
question: Will more than 83 countries and territories be rated Repressed or
  Closed in the CIVICUS Monitor's 2026 edition?
resolutionDate: 2027-01-31
resolutionCriteria: Resolves YES if the CIVICUS Monitor's 2026 annual ratings,
  released with the People Power Under Attack 2026 report, rate more than 83 of
  the countries and territories covered as either Repressed or Closed. Resolves
  NO at 83 or fewer. The 2025 edition, published 2025-12-09, rated 83 of 198 as
  Repressed or Closed. If the 2026 edition has not been published by 2027-01-31,
  this resolves as annulled.
resolutionSource:
  label: CIVICUS Monitor
  url: https://monitor.civicus.org/
  kind: dataset
  finding: Rates civic space in 198 countries and territories on a five-point
    scale, updated annually with the People Power Under Attack report, published
    2025-12-09 for the 2025 edition. Chosen over V-Dem and Freedom House because
    its December release resolves inside the short-horizon window where their
    March releases do not.

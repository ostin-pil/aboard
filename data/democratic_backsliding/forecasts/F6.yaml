id: F6
attachedToClaimId: L3
question: Will the OECD.AI Policy Navigator list more than 151 legally binding policy
  initiatives as of 2027-03-31?
resolutionDate: 2027-03-31
resolutionCriteria: Resolves YES if, on 2027-03-31, the OECD.AI Policy Navigator's
  all-initiatives view filtered to Legally Binding equals Yes reports a count greater
  than 151. The count stood at exactly 151, out of 2457 initiatives in total, when
  this forecast was filed on 2026-07-30. Resolves NO if the count is 151 or fewer.
resolutionSource:
  label: OECD.AI Policy Navigator
  url: https://oecd.ai/en/dashboards/policy-initiatives
  kind: policy
  finding: Living repository of AI policy initiatives from more than 80 jurisdictions,
    with a legally-binding filter and a headline count on the results view. Baseline
    of 151 binding of 2457 total read directly from that view on 2026-07-30.
predictions:

    probability: 0.93
    reasoning: "This is a registry-growth question and the prior is high by
      construction, which is worth stating plainly rather than dressing up. The
      Navigator is curated continuously, national implementations of the EU AI Act
      are landing one country at a time (Greece's Law 5321/2026 is already in the

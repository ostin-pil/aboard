      agent: claude-opus-5
      promptTitle: Short-horizon forecast slate v0.1
      generatedAt: 2026-07-30T11:20:00Z
    probability: 0.12
    reasoning: The arithmetic does most of the work here. The trailing 180-day
      figure of 43% already covers roughly February to July 2026, so those
      months are close to locked in, and clearing 50% for the calendar year
      would require the second half to run far above 50% to drag the annual
      average across. A seven-point annual move is large for a metric that
      reflects platform tooling choices and reporting conventions rather than
      anything that shifts quickly. The scenario that would do it is
      compositional rather than behavioural, a single very high-volume platform
      changing how it classifies or submits, since the totals are dominated by a
      handful of submitters. That tail is real, which is why this is not nearer
      zero, but it is not the way to bet.

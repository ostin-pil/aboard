id: F7
attachedToClaimId: M4
question: Will fully automated decisions exceed 50% of statements of reasons
  submitted to the DSA Transparency Database for calendar 2026?
resolutionDate: 2027-03-31
resolutionCriteria: Resolves YES if, computed over statements of reasons whose
  decision date falls between 2026-01-01 and 2026-12-31 inclusive, as obtained
  from the DSA Transparency Database daily dumps or its research API, the share
  recorded as fully automated exceeds 50%. Resolves NO at 50% or below. The
  database reported 43% fully automated across a rolling 180-day window when
  this forecast was filed on 2026-07-30.
resolutionSource:
  label: EU DSA Transparency Database
  url: https://transparency.dsa.ec.europa.eu/
  kind: dataset
  finding: Official EU database of content-moderation statements of reasons, 3.32
    billion submitted from 359 active platforms as of 2026-07-30, with a
    fully-automated flag on each record and daily dumps plus a research API for
    recomputation.
predictions:

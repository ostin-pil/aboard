id: F8
attachedToClaimId: L3
question: Will at least 5 of 6 named VLOP social platforms publish a DSA Article
  42 transparency report covering 1 July to 31 December 2026 by 2027-03-31?
resolutionDate: 2027-03-31
resolutionCriteria: The six platforms are Facebook, Instagram, TikTok, YouTube,
  X and LinkedIn. Resolves YES if, by 2027-03-31, at least 5 of those 6 have a
  publicly available transparency report covering the 1 July to 31 December 2026
  reporting period, as listed in the European Commission's DSA transparency
  report tables. Resolves NO if 4 or fewer do. Article 42 sets the publication
  deadline at two months after the reporting period ends, so 2027-02-28, one
  month before this resolves.
resolutionSource:
  label: European Commission, How the Digital Services Act enhances transparency
    online
  url: https://digital-strategy.ec.europa.eu/en/policies/dsa-brings-transparency
  kind: policy
  finding: Official Commission page carrying per-company tables that link each
    designated platform's published transparency reports, with entries running
    from 2023 through February 2026, and stating the every-six-months obligation
    for VLOPs and VLOSEs.

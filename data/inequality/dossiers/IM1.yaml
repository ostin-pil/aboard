con:
  thesis: r > g is not a robust structural driver of the wealth distribution; the
    measured capital-share dynamics are dominated by housing and depend on an
    elasticity assumption that the evidence does not support.
  steelmannedSummary: Rognlie's decomposition shows that the entire long-run rise
    in the net capital share is attributable to housing, not to the reproducible
    capital Piketty's mechanism concerns; net of depreciation, non-housing
    capital's share is roughly flat. The r > g dynamic also requires an
    elasticity of substitution between capital and labour above 1, so that
    capital deepening raises capital's share, but most micro and macro estimates
    put it below 1, which reverses the prediction. Acemoglu and Robinson argue
    that reducing distributional outcomes to a two-rate inequality omits the
    political and institutional forces that actually govern top shares, and that
    the historical r > g correlation is not a law but a contingent product of
    specific tax, war, and asset conditions. On this reading IM1 mistakes a
    housing-and-institutions story for a general law of capital.
  keySources:
    - label: Rognlie — Deciphering the fall and rise in the net capital share
      url: https://www.brookings.edu/articles/deciphering-the-fall-and-rise-in-the-net-capital-share/
      kind: paper
      year: 2015
      authors: Rognlie
      finding: The long-run rise in the net capital share is concentrated in housing;
        net of depreciation, non-housing capital's share is roughly flat.
    - label: Acemoglu & Robinson — The Rise and Decline of General Laws of Capitalism
      url: https://www.aeaweb.org/articles?id=10.1257/jep.29.1.3
      kind: paper
      year: 2015
      authors: Acemoglu, Robinson
      finding: Argues top wealth shares are governed by political and institutional
        forces that a two-rate r > g inequality omits; the historical
        correlation is contingent, not a law.

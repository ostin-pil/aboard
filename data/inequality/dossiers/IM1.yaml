pro:
  thesis: When the after-tax return on capital exceeds the economy's growth rate,
    wealth concentrates structurally, and this r > g condition has held across
    most of modern history.
  steelmannedSummary: Piketty's long-run series show r (4-5%) exceeding g (1-2%)
    across most of the last two centuries outside the mid-20th-century
    exceptions of war and reconstruction. When capital income compounds faster
    than the wage bill grows, inherited wealth outpaces earned income and the
    wealth distribution's top tail thickens mechanically, independent of
    individual behaviour. The World Inequality Database's reconstructed wealth
    series show exactly this top-tail thickening resuming after 1980 as postwar
    capital-destruction and high-tax conditions faded. The mechanism does not
    require any assumption about worker productivity or merit; it follows from
    an arithmetic inequality between two rates, which is why it is robust to the
    specific composition of capital.
  keySources:
    - label: Piketty — Capital in the Twenty-First Century
      url: https://piketty.pse.ens.fr/en/capital21c2
      kind: book
      year: 2014
      authors: Piketty
      finding: Reconstructed long-run series showing r > g across most of modern
        history outside the mid-20th century, with wealth concentration tracking
        the gap.
    - label: World Inequality Database — wealth series
      url: https://wid.world/
      kind: dataset
      finding: Top wealth shares resume rising after 1980 as postwar
        capital-destruction and high-tax conditions fade, consistent with an r >
        g compounding channel.

attachedToClaimId: IM2
pro:
  thesis: >-
    Regulatory supply constraints in high-productivity metros are a first-order
    driver of both aggregate output loss and intergenerational immobility,
    operating through a housing-mediated channel distinct from capital-income
    concentration.
  steelmannedSummary: >-
    The mechanism has three measured links. First, constraints bind where
    productivity is highest. Hsieh and Moretti estimate that relaxing land-use
    restrictions in the most constrained US metros would have raised aggregate
    output substantially over 1964 to 2009, because workers cannot move to
    where their marginal product is greatest. Second, the resulting price wedge
    is regulatory rather than physical. Glaeser and Gyourko document that in
    constrained markets prices sit far above the physical cost of construction,
    a gap that tracks regulatory stringency rather than land scarcity or build
    costs. Third, and most directly on the immobility claim, Ganong and Shoag
    show that regional income convergence in the US operated for a century and
    then stopped, and that the break is explained by housing costs. Low-skill
    households once moved to high-wage places and converged; now the housing
    cost of that move exceeds the wage gain, so they sort the other way. That
    is the compounding channel the claim describes. Incumbent owners capture
    the appreciation as unearned wealth while the households who would have
    gained most from access are precisely the ones priced out, which makes the
    transfer regressive in both the static and the intergenerational sense.
  keySources:
    - label: Hsieh and Moretti, Housing Constraints and Spatial Misallocation
      url: https://www.aeaweb.org/articles?id=10.1257/mac.20170388
      kind: paper
      year: 2019
      authors: Hsieh, Moretti
      finding: >-
        Land-use constraints in high-productivity metros misallocate labour
        across space, with large estimated aggregate output losses.
    - label: Ganong and Shoag, Why has regional income convergence in the U.S. declined?
      url: https://doi.org/10.1016/j.jue.2017.07.002
      kind: paper
      year: 2017
      authors: Ganong, Shoag
      finding: >-
        A century of regional income convergence halts, and the break is
        attributed to housing costs choking off migration by lower-income
        households to high-wage places.
    - label: Glaeser and Gyourko, The Economic Implications of Housing Supply
      url: https://www.aeaweb.org/articles?id=10.1257/jep.32.1.3
      kind: paper
      year: 2018
      authors: Glaeser, Gyourko
      finding: >-
        In constrained markets prices exceed physical construction cost by a
        wide margin, and the wedge tracks regulatory stringency.
  authoredBy:
    agent: claude-opus-5

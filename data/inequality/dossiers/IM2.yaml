cruxes:
  - statement: >-
      Does by-right upzoning produce units, or capitalise into land values?
      This is the crux that would actually move policy. If Freemark's Chicago
      null result generalises, IL2 is not a leverage point regardless of
      whether IM2's diagnosis is correct, and the intervention has to shift to
      public or subsidised production. If it does not generalise, the case for
      deregulation is close to settled.
    impactScore: 0.9
    uncertainty: 0.65
  - statement: >-
      Is the halt in regional income convergence caused by housing costs, or by
      non-housing changes in migration behaviour such as dual-earner
      households, occupational licensing and place attachment? Resolving this
      determines whether the immobility half of the claim survives. The wealth
      transfer half is unaffected either way.
    impactScore: 0.8
    uncertainty: 0.55
  - statement: >-
      Over what horizon does new market-rate supply reach lower-income
      households through filtering? Resolving this changes the argument less
      than it appears. Both sides already accept that filtering is real and
      slow, so a precise estimate mostly reprices the claim's urgency rather
      than its truth.
    impactScore: 0.45
    uncertainty: 0.4
  - statement: >-
      Would supply sufficient to move prices be absorbed by high-income
      in-migration, leaving the exclusion of lower-income entrants intact? This
      is the superstar-cities challenge, and the one crux where the two
      dossiers are not merely weighing the same evidence differently but
      disagree about what the counterfactual metro looks like.
    impactScore: 0.75
    uncertainty: 0.7

con:
  thesis: >-
    Supply constraints are real, but the claim overstates them as a lever. The
    policy instrument that would relax them has not reliably produced units,
    and the price dynamics in the affected metros are driven substantially by
    demand composition that supply reform cannot reach.
  steelmannedSummary: >-
    The con case is not that zoning is harmless. It is that the causal chain
    from deregulation to units to affordability to mobility breaks at the first
    link, which is where the claim's policy relevance lives. Freemark's study
    of Chicago's transit-oriented upzoning found that parcels upzoned by right
    saw property values rise with no detectable increase in construction over
    the following five years. If upzoning capitalises into land values without
    producing housing, then either the constraint is not the binding one or the
    reform does not release it, and either way the lever fails. Gyourko, Mayer
    and Sinai's superstar-cities work supplies the demand-side alternative.
    Persistent real price growth in a fixed set of desirable metros follows
    from a growing national population of high-income households bidding for a
    fixed stock of desirable locations, which produces the same price path and
    the same exclusion of lower-income entrants without zoning being the
    operative cause. On that reading, marginal supply is absorbed by the top of
    the income distribution and the exclusion persists. Been, Ellen and
    O'Regan, reviewing this literature sympathetically to supply, still concede
    the qualifications that matter here. Affordability effects run at regional
    rather than neighbourhood scale, they arrive through filtering over decades
    rather than years, and they can be locally offset in the short run. A
    mechanism operating at that latency is a weak account of the
    intergenerational immobility the claim attributes to it.
  keySources:
    - label: Freemark, Upzoning Chicago
      url: https://doi.org/10.1177/1078087418824672
      kind: paper
      year: 2019
      authors: Freemark
      finding: >-
        By-right upzoning near transit raised parcel values with no detectable
        increase in construction over five years, breaking the deregulation to
        units link.
    - label: Gyourko, Mayer and Sinai, Superstar Cities
      url: https://doi.org/10.1257/pol.5.4.167
      kind: paper
      year: 2013
      authors: Gyourko, Mayer, Sinai
      finding: >-
        Persistent price growth in desirable metros is driven by a growing
        number of high-income bidders for a fixed set of locations, producing
        exclusion without zoning as the operative cause.
    - label: Been, Ellen and O'Regan, Supply Skepticism
      url: https://doi.org/10.1080/10511482.2018.1476899
      kind: paper
      year: 2018
      authors: Been, Ellen, O'Regan
      finding: >-
        Reviewing the evidence in supply's favour, still finds affordability
        effects operate regionally and through multi-decade filtering rather
        than locally and quickly.
  authoredBy:
    agent: claude-opus-5
    promptTitle: Dual-dossier author v0.1

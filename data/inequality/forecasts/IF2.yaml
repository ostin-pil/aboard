question: Will the US nonfarm business sector labor share for 2026 Q4 be below
  its 2025 Q4 value?
resolutionDate: 2027-02-28
resolutionCriteria: Resolves YES if the labor share of nonfarm business sector
  output for 2026 Q4, as first published by BLS in the Productivity and Costs
  release scheduled for February 2027, is strictly lower than the 2025 Q4 value
  shown in that same release. Resolves NO if it is equal or higher. Revisions
  after first publication do not change the resolution.
resolutionSource:
  label: BLS Productivity and Costs
  url: https://www.bls.gov/productivity/
  kind: dataset
  finding: Publishes the nonfarm business sector labor share quarterly, initial
    estimate roughly five weeks after quarter end. Labor share stood at 54.1% in
    2026 Q1, a record low against roughly 65% in the early 1950s.

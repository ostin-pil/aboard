    reasoning: The secular direction is unambiguous and IM1's whole claim rests on it, but this question asks about a single year-over-year step, which is much noisier than the trend. Two things pull against each other. Labor share reaching a record low in 2026 Q1 means the level is already deep in the tail, where mean reversion is more likely than continuation, and quarterly labor share moves partly with cyclical compensation timing rather than the structural capital-labor split. Against that, year-over-year declines have been the more common outcome than increases over the past two decades, and nothing in the current compensation or productivity picture suggests a reversal large enough to erase the gap. Settling slightly above even reflects a real trend applied to a noisy one-year window, not confidence about 2026 specifically.

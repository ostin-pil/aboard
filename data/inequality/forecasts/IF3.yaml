    reasoning: IM2 claims supply constraints are structural, and a 1% national increase is a low bar that a genuine supply response would clear easily, so this is close to a direct test of whether reform has begun to bite at national scale. The reasons to doubt it are mostly financing rather than zoning. Permit volumes have been soft under a sustained high-rate environment, and national totals are dominated by the large Sun Belt markets where the binding constraint is cost of capital, not entitlement. The upzoning measures that would move the number act on a 2 to 3 year lag and are concentrated in exactly the constrained metros that contribute least to the national count. A 1% threshold is small enough that a modest rate move could carry it, which is why this sits well above negligible rather than near zero.

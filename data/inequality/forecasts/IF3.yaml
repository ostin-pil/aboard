id: IF3
attachedToClaimId: IM2
question: Will total US housing units authorized by building permits in calendar
  2026 exceed the calendar 2025 total by at least 1%?
resolutionDate: 2027-03-31
resolutionCriteria: Resolves YES if the sum of monthly not-seasonally-adjusted
  privately-owned housing units authorized in permit-issuing places for January
  through December 2026, as published in the Census Building Permits Survey
  tables, is at least 1% higher than the same sum for January through December
  2025. Resolves NO otherwise. December 2026 preliminary data publishes on the
  12th workday of January 2027 and revised data on the 17th workday, both well
  before the resolution date.
resolutionSource:
  label: US Census Building Permits Survey (BPS)
  url: https://www.census.gov/construction/bps/
  kind: dataset
  finding: Publishes housing units authorized monthly at national, state, CBSA,
    county and place level, on the 12th workday for preliminary and the 17th for
    revised figures. The same survey resolves IF1 at metro level in 2028; this
    question uses the national monthly series so it can settle in early 2027.

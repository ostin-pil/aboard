pro:
  thesis: Habitual egg and dietary-cholesterol consumption is a genuine, dose-dependent contributor to cardiovascular risk, not a nutritional non-issue.
  steelmannedSummary: "There is a plausible mechanistic chain — dietary cholesterol raises serum LDL in a substantial minority of hyper-responders, and LDL is a well-established causal cardiovascular risk factor. The largest US pooled analysis with harmonized individual-level data (Zhong 2019, JAMA; 29,615 adults across six cohorts) found a monotone dose-response: each additional half-egg per day was associated with 6% higher CVD risk and 8% higher all-cause mortality, and the relationship held on absolute-risk terms. Many of the reassuring meta-analyses adjust for serum cholesterol or overall diet quality — but if eggs act on CVD *through* serum LDL, that adjustment removes the causal pathway and biases the estimate toward the null. The effect is concentrated where it is most plausible physiologically (people with diabetes and insulin resistance), which is a signal of a real biological effect, not a statistical artifact. Given cheap substitutes, the precautionary reading is warranted for at-risk groups."
  keySources:
    - label: Zhong et al. — Dietary Cholesterol or Egg Consumption and CVD/Mortality (JAMA)
      url: https://pubmed.ncbi.nlm.nih.gov/30874756/
      kind: paper
      year: 2019
      authors: Zhong, Van Horn, Cornelis, et al.
      finding: Pooled individual-level analysis of six US cohorts; dose-response association of egg and dietary-cholesterol intake with incident CVD and all-cause mortality.
    - label: Zhuang et al. — Egg/cholesterol and mortality; updated meta-analysis (Circulation)
      url: https://www.ahajournals.org/doi/10.1161/CIRCULATIONAHA.121.057642
      kind: paper
      year: 2022
      finding: Associations are stronger in some subgroups and adjustment sets, consistent with a real effect modified by metabolic status.

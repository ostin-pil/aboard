cruxes:
  - statement: If individual-participant reanalyses with a harmonized, pre-registered confounder set (diet quality, red/processed meat, physical activity, socio-economic status) eliminate the egg–CVD association, the con thesis is supported; if a dose-response survives full adjustment, the pro thesis is supported.
    impactScore: 0.85
    uncertainty: 0.7
  - statement: If eggs raise CVD chiefly by raising serum LDL, then meta-analyses adjusting for blood cholesterol are adjusting away the causal pathway and understate the effect (supports pro); if the null holds in analyses that do not adjust for the mediator, the con thesis is supported.
    impactScore: 0.7
    uncertainty: 0.65
  - statement: If the association is concentrated in people with diabetes or insulin resistance and is absent in metabolically healthy adults, the general-population claim (pro) is not supported even though a real subgroup effect may exist.
    impactScore: 0.65
    uncertainty: 0.6

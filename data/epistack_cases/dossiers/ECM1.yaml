con:
  thesis: In the general population, moderate egg consumption is not a meaningful independent cardiovascular risk factor; apparent associations reflect confounding by dietary pattern and lifestyle.
  steelmannedSummary: "The best-adjusted evidence is null. Drouin-Chartier (2020, BMJ) analysed three large US cohorts and an updated meta-analysis of 1.72 million participants and found no association between one egg per day and incident CVD after adjusting for lifestyle and dietary factors. Dose-response meta-analysis (Sabaté 2020, Eur J Nutrition) finds up to one egg/day unassociated with — and up to roughly six/week inversely associated with — CVD. The 2015 US Dietary Guidelines removed the 300 mg/day dietary-cholesterol cap precisely because the population-level evidence for harm did not hold up. Tellingly, in the very study most cited for harm (Zhong 2019), the dietary-cholesterol association became non-significant after adjusting for eggs and red meat — a fingerprint of confounding, since eggs travel with bacon, butter, and low-quality dietary patterns. Where eggs displace refined-carbohydrate breakfasts, the net effect may be neutral or favourable."
  keySources:
    - label: Drouin-Chartier et al. — Egg consumption and CVD; three US cohorts + meta-analysis (BMJ)
      url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7190072/
      kind: paper
      year: 2020
      authors: Drouin-Chartier, et al.
      finding: One egg/day not associated with incident CVD after adjustment; updated meta-analysis of 1,720,108 participants concordant.
    - label: Sabaté et al. — Egg consumption and cardiovascular risk, dose-response meta-analysis (Eur J Nutrition)
      url: https://link.springer.com/article/10.1007/s00394-020-02345-7
      kind: paper
      year: 2020
      finding: Up to one egg/day not associated with CVD events; up to ~six/week inversely associated versus no consumption.
  authoredBy:
    agent: claude-opus-4-8
